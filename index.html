<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>

  <body>
    <div class="container">
      <div class="sidebar">
        <div class="branding">
          <img src="./img/dashboard.svg" alt="" width="48" height="48">
          <h1>Dashboard</h1>
        </div>
        <div class="navigation">
          <ul>
            <li>
              <a href="#">
                <img src="./img/home.svg" alt="" width="24" height="24">
                <span>Home</span>
              </a>
            </li>
            <li>
              <a href="#">
                <img src="./img/profile.svg" alt="" width="24" height="24">
                <span>Profile</span>
              </a>
            </li>
            <li>
              <a href="#">
                <img src="./img/message.svg" alt="" width="24" height="24">
                <span>Messages</span>
              </a>
            </li>
            <li>
              <a href="#">
                <img src="./img/clock.svg" alt="" width="24" height="24">
                <span>History</span>
              </a>
            </li>
            <li>
              <a href="#">
                <img src="./img/note.svg" alt="" width="24" height="24">
                <span>Tasks</span>
              </a>
            </li>
            <li>
              <a href="#">
                <img src="./img/account-group.svg" alt="" width="24" height="24">
                <span>Communities</span>
              </a>
            </li>
          </ul>
        </div>
        <div class="navigation">
          <ul>
            <li>
              <a href="#">
                <img src="./img/cog.svg" alt="" width="24" height="24">
                <span>Settings</span>
              </a>
            </li>
            <li>
              <a href="#">
                <img src="./img/help-box.svg" alt="" width="24" height="24">
                <span>Support</span>
              </a>
            </li>
            <li>
              <a href="#">
                <img src="./img/shield-check.svg" alt="" width="24" height="24">
                <span>Privacy</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="header">
        <div class="search-bar">
          <img src="./img/magnify.svg" alt="" width="24" height="24">
          <input type="search" id="site-search" name="q" disabled>
        </div>
        <div class="profile">
          <a href="#">
            <img src="./img/bell.svg" alt="Notifications" width="24" height="24">
          </a>
          <div class="avatar">
            <img src="./img/cat.png" alt="Morgan Oakley" width="36" height="36">
          </div>
          <p>Morgan Oakley</p>
        </div>
        <div class="greeting">
          <div class="avatar">
            <img src="./img/cat.png" alt="Morgan Oakley" width="48" height="48">
          </div>
          <div>
            <p>Hi there,</p>
            <p>Morgan Oakley (@morgan)</p>
          </div>
        </div>
        <div class="btn-container">
          <button>New</button>
          <button>Upload</button>
          <button>Share</button>
        </div>
      </div>
    </div>
  </body>
</html>
